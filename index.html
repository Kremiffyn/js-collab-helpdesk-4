<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Helpdesk</title>
    <link rel="icon" href="images/lisokona.png">
    <link rel="stylesheet" href="styl.css">
    <script src="script.js" type="module"></script>
</head>
<body>
    
    <audio id="backgroundMusic" autoplay loop>
        <source src="./sounds/music.mp3" type="audio/mpeg">
    </audio>
    <h1>Helpdesk</h1>

    <div class="panels">

        <div class="panel">

            <h2>Add Ticket</h2>

            <form id="ticketForm">

                <label for="title">Problem:</label>
                <input type="text" id="title" name="title">

                <p>Priority:

                        <input type="radio" name="priority" value="high">
                         <label>High</label>

                        <input type="radio" name="priority" value="normal" checked>
                        <label>Normal</label>
     
                        <input type="radio" name="priority" value="low">
                        <label>Low</label>

                </p>

                <button type="submit">Add Ticket</button>

            </form>
            <p id="message_add"></p>

        </div>

        <div class="panel">

            <h2>Filter Tickets</h2>

            <label for="statusFilter">Filter by status:</label>

            <select id="statusFilter">
                <option value="all">All</option>
                <option value="new">New</option>
                <option value="doing">Doing</option>
                <option value="done">Done</option>
            </select>

            <p>
                Visible: <span id="visibleCount">0</span>
                / All: <span id="totalCount">0</span>
            </p>

            <button id="resetMemory" type="button">
                Reset Memory
            </button>
        </div>

        <div class="panel">

            <h2>Change Status</h2>

            <label for="ticketId">Ticket ID:</label>
            <input type="text" id="ticketId">

            <br>
            <br>

            <label for="newStatus">New status:</label>

            <select id="newStatus">
                <option value="new">New</option>
                <option value="doing">Doing</option>
                <option value="done">Done</option>
            </select>

            <br>
            <br>

            <button id="changeStatus" type="button" onclick="changeStatus()">
                Change Status
            </button>

            <p id="message_change"></p>

        </div>

    </div>
    
    <div class="tickets-section">

    <h2>Tickets</h2>
        
    <div class="dropdown">

        <button id="menuButton" type="button">
            Menu ▼
        </button>

        <div id="menuContent" class="dropdown-content">

            <label for="fileInput" class="dropdown-item">
                Import
            </label>

            <div class="dropdown-item export-option">
                Eksport ▼

                <div class="export-submenu">
                    <button id="exJSON" type="button">JSON</button>
                    <button id="exCSV" type="button">CSV</button>
                    <button id="exXML" type="button">XML</button>
                </div>
            </div>

            <div class="dropdown-item" id="changeMode">
                Change mode
            </div>

        </div>

    </div>

    <input type="file" id="fileInput" accept=".json,.csv,.xml" hidden>

    <p id="message_import"></p>

    </div>

    <input type="file" id="fileInput" accept=".json,.csv,.xml" hidden>

    <p id="message_import"></p>

    <ul id="ticketList">
    </ul>

    <div id="importConfirm" class="import-window">
        <div class="import-content">
            <h3>Import data</h3>
            <p>Are you sure you want to import this file?</p>
            <p id="message_import_confirm"></p>
            <button id="cancel">Cancel</button>
            <button id="confirm">Confirm</button>
        </div>
    </div>

    <img id="Fox" src="images/ArcticFox.png" alt="lisio">

    <img id="Snowman" src="images/Snowman.png" alt="balwanek">
    
    <div class="footer">

    </div>
    
</body>
</html>
